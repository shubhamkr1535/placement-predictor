<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🎓 Placement Predictor</h1>
            <p class="subtitle">Enter your details to predict your placement outcome</p>
            
            <form id="predictionForm">
                <div class="form-group">
                    <label for="iq">IQ Score</label>
                    <input type="number" id="iq" name="iq" placeholder="Enter your IQ score" required step="0.01" min="0">
                </div>
                
                <div class="form-group">
                    <label for="cgpa">CGPA</label>
                    <input type="number" id="cgpa" name="cgpa" placeholder="Enter your CGPA (0-10)" required step="0.01" min="0" max="10">
                </div>
                
                <button type="submit" class="predict-btn">
                    <span class="btn-text">Predict Placement</span>
                    <span class="loader" style="display: none;"></span>
                </button>
            </form>
            
            <div id="result" class="result-box" style="display: none;">
                <div class="result-content">
                    <div class="result-icon"></div>
                    <p class="result-text"></p>
                </div>
            </div>
            
            <div id="error" class="error-box" style="display: none;">
                <p class="error-text"></p>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('predictionForm');
        const resultBox = document.getElementById('result');
        const errorBox = document.getElementById('error');
        const resultText = document.querySelector('.result-text');
        const errorText = document.querySelector('.error-text');
        const resultIcon = document.querySelector('.result-icon');
        const btnText = document.querySelector('.btn-text');
        const loader = document.querySelector('.loader');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Hide previous results
            resultBox.style.display = 'none';
            errorBox.style.display = 'none';
            
            // Show loader
            btnText.style.display = 'none';
            loader.style.display = 'inline-block';
            
            const iq = document.getElementById('iq').value;
            const cgpa = document.getElementById('cgpa').value;
            
            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ iq, cgpa })
                });
                
                const data = await response.json();
                
                // Hide loader
                btnText.style.display = 'inline';
                loader.style.display = 'none';
                
                if (response.ok) {
                    resultText.textContent = data.prediction;
                    
                    // Add appropriate styling based on result
                    if (data.prediction.includes('will get placed')) {
                        resultBox.className = 'result-box success';
                        resultIcon.textContent = '✓';
                    } else {
                        resultBox.className = 'result-box failure';
                        resultIcon.textContent = '✗';
                    }
                    
                    resultBox.style.display = 'block';
                    
                    // Smooth scroll to result
                    resultBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    errorText.textContent = data.error || 'An error occurred';
                    errorBox.style.display = 'block';
                }
            } catch (error) {
                // Hide loader
                btnText.style.display = 'inline';
                loader.style.display = 'none';
                
                errorText.textContent = 'Network error. Please try again.';
                errorBox.style.display = 'block';
            }
        });
        
        // Clear errors when user starts typing
        document.getElementById('iq').addEventListener('input', () => {
            errorBox.style.display = 'none';
        });
        
        document.getElementById('cgpa').addEventListener('input', () => {
            errorBox.style.display = 'none';
        });
    </script>
</body>
</html>
